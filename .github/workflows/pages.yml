name: Deploy Independent Living Canada website
# Pages source confirmed as GitHub Actions
# Public safeguards run before the Pages artifact is created.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "config.js"
      - "admin.html"
      - "admin.js"
      - "admin.css"
      - "privacy.html"
      - "accessibility.html"
      - "funding.html"
      - "find-support.html"
      - "verification.html"
      - "resources.html"
      - "scripts/check-public-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Validate JavaScript syntax
        run: |
          node --check --input-type=module < app.js
          node --check --input-type=module < admin.js
      - name: Check public-site safeguards
        run: node scripts/check-public-site.mjs
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html app.js styles.css config.js admin.html admin.js admin.css privacy.html accessibility.html funding.html find-support.html verification.html resources.html _site/
          touch _site/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Allow Pages artifact metadata to propagate
        run: sleep 10
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
